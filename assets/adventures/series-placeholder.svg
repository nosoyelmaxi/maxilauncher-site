<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">MaxiLauncher series placeholder</title>
  <desc id="desc">Neutral placeholder artwork for a MaxiLauncher series until custom artwork is provided.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141414"/>
      <stop offset="1" stop-color="#2a1a14"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="90" y="90" width="1420" height="720" rx="36" fill="none" stroke="#d45a2a" stroke-width="8" opacity="0.7"/>
  <text x="800" y="430" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="96" font-weight="700">MaxiLauncher</text>
  <text x="800" y="535" text-anchor="middle" fill="#d45a2a" font-family="Arial, sans-serif" font-size="54">Series artwork pending</text>
</svg>
